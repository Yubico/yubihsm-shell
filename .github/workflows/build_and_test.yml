name: Build and Test

on: [push, pull_request]

jobs:
  build_debian_derivatives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: "ubuntu:26.04"
            cc: "gcc"
            upload_for_test: "false"
          - environment: "ubuntu:26.04"
            cc: "clang"
            upload_for_test: "false"
          - environment: "ubuntu:25.10"
            cc: "gcc"
            upload_for_test: "false"
          - environment: "ubuntu:25.10"
            cc: "clang"
            upload_for_test: "false"
          - environment: "ubuntu:24.04"
            cc: "gcc"
            upload_for_test: "false"
          - environment: "ubuntu:24.04"
            cc: "clang"
            upload_for_test: "true"
          - environment: "ubuntu:22.04"
            cc: "gcc"
            upload_for_test: "false"
          - environment: "ubuntu:22.04"
            cc: "clang"
            upload_for_test: "false"
          - environment: "debian:13"
            cc: "gcc"
            upload_for_test: "false"
          - environment: "debian:13"
            cc: "clang"
            upload_for_test: "false"
          - environment: "debian:12"
            cc: "gcc"
            upload_for_test: "false"
          - environment: "debian:12"
            cc: "clang"
            upload_for_test: "false"

    name: build on ${{ matrix.environment }} (${{ matrix.cc }},${{ matrix.upload_for_test}})
    runs-on: ubuntu-latest
    container: ${{ matrix.environment }}

    steps:

      - name: install dependencies from package management
        env:
          CC: ${{ matrix.cc }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update
          apt install -q -y build-essential       \
                            cmake pkg-config      \
                            gengetopt             \
                            help2man              \
                            libcurl4-openssl-dev  \
                            libedit-dev           \
                            libpcsclite-dev       \
                            libusb-1.0-0-dev      \
                            libssl-dev            \
                            file                  \
                            curl                  \
                            jq                    \
                            zlib1g-dev

          if [ "$CC" = "clang" ]; then
            apt install -q -y clang llvm lld
          fi

      - name: clone the Yubico/yubihsm-shell repository
        uses: actions/checkout@v4
        with:
          path: yubihsm-shell

      - name: apply environment specific changes to CMakeLists.txt
        working-directory: yubihsm-shell
        if: ${{ matrix.environment == 'ubuntu:14.04' }}
        run: |
          # ubuntu 14.04 comes with cmake version 2.8, but the project requires 3.5
          # we downgrade that requirement for the ubuntu 14.04 build
          sed -i 's/cmake_minimum_required (VERSION 3.5)/cmake_minimum_required (VERSION 2.8)/' CMakeLists.txt
          # we also remove the following policies which are not supported in the older cmake version
          sed -i 's/cmake_policy(SET CMP0025 NEW)/#cmake_policy(SET CMP0025 NEW)/' CMakeLists.txt
          sed -i 's/cmake_policy(SET CMP0042 NEW)/#cmake_policy(SET CMP0042 NEW)/' CMakeLists.txt
          sed -i 's/cmake_policy(SET CMP0054 NEW)/#cmake_policy(SET CMP0054 NEW)/' CMakeLists.txt
          # append the following flags: -Wno-missing-braces -Wno-missing-field-initializers -Wno-implicit-function-declaration
          sed -i 's/-Wall -Wextra -Werror/-Wall -Wextra -Werror -Wno-missing-braces -Wno-missing-field-initializers -Wno-implicit-function-declaration/' cmake/SecurityFlags.cmake

      - name: apply environment specific changes to CMakeLists.txt
        working-directory: yubihsm-shell
        env:
          DOCKER_IMAGE: ${{ matrix.environment }}
        run: |

          if [ "$DOCKER_IMAGE" = "ubuntu:25.04" ] || [ "$DOCKER_IMAGE" = "ubuntu:25.10" ] || [ "$DOCKER_IMAGE" = "ubuntu:26.04" ]; then
            # ubuntu 24.10 and above comes with _FORTIFY_SOURCE already set
            sed -i 's/add_definitions (-D_FORTIFY_SOURCE=2)/add_definitions (-D_FORTIFY_SOURCE=3)/' cmake/SecurityFlags.cmake
          fi

      - name: do build
        working-directory: yubihsm-shell
        env:
          CC: ${{ matrix.cc }}
          VERBOSE: 1
        run: |
          mkdir build
          cd build
          if [ "$CC" = "gcc" ]; then
            cmake -DRELEASE_BUILD=1 -DWITHOUT_YKYH=1 ..
          else
            cmake -DRELEASE_BUILD=1 -DWITHOUT_YKYH=1 \
              -DCMAKE_AR=/usr/bin/llvm-ar \
              -DCMAKE_RANLIB=/usr/bin/llvm-ranlib \
              -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
              ..
          fi
          cmake --build .

      - name: do static build
        working-directory: yubihsm-shell
        env:
          CC: ${{ matrix.cc }}
          VERBOSE: 1
          BUILD_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          mkdir build-static
          cd build-static
          if [ "$CC" = "gcc" ]; then
            cmake -DENABLE_STATIC=ON -DCMAKE_BUILD_TYPE=Release ..
          else
            cmake -DENABLE_STATIC=ON -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_AR=/usr/bin/llvm-ar \
              -DCMAKE_RANLIB=/usr/bin/llvm-ranlib \
              -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
              ..
          fi
          cmake --build .

      - name: prepare name for upload-artifact action
        env:
          DOCKER_IMAGE: ${{ matrix.environment }}
          CC: ${{ matrix.cc }}
        run: |
          ESCAPED_IMAGE=$(echo -n "$DOCKER_IMAGE" | sed -E 's/[^a-zA-Z0-9]//g')
          echo "ARTIFACT_NAME=yubihsm-shell_${ESCAPED_IMAGE}_${CC}" >> $GITHUB_ENV

      - name: create compressed tar file
        if: ${{ matrix.upload_for_test == 'true' }}
        run: tar cfz yubihsm-shell.tar.gz yubihsm-shell

      - name: upload artifacts for the test job
        if: ${{ matrix.upload_for_test == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ARTIFACT_NAME }}"
          path: yubihsm-shell.tar.gz

  build_centos_fedora:
    strategy:
      fail-fast: false
      matrix:
        include:
          # we do not perform clang builds for all environments, only fedora
          - environment: "fedora:44"
            cc: "gcc"
            upload_for_test: "true"
          - environment: "fedora:44"
            cc: "clang"
            upload_for_test: "false"
          - environment: "fedora:43"
            cc: "gcc"
            upload_for_test: "false"
          - environment: "fedora:43"
            cc: "clang"
            upload_for_test: "false"

    name: build on ${{ matrix.environment }} (${{ matrix.cc }}, ${{ matrix.upload_for_test }})
    runs-on: ubuntu-latest
    container: ${{ matrix.environment }}

    steps:

      - name: clone the Yubico/yubihsm-shell repository
        uses: actions/checkout@v4
        with:
          path: yubihsm-shell

      - name: extract platform name
        env:
          DOCKER_IMAGE: ${{ matrix.environment }}
        run: |
          # Remove everything from DOCKER_IMAGE that is not a letter or a number
          PLATFORM=$(echo -n "$DOCKER_IMAGE" | sed -E 's/[^a-zA-Z0-9]//g')
          echo "PLATFORM=$PLATFORM" >> $GITHUB_ENV

      - name: install dependencies from package management
        env:
          CC: ${{ matrix.cc }}
          PLATFORM: ${{ env.PLATFORM }}
        run: |
          cd yubihsm-shell/resources/release/linux
          ./install_redhat_dependencies.sh $PLATFORM

          if [ "$CC" = "clang" ]; then
            yum install -y clang llvm lld
          fi

      - name: apply environment specific changes to CMakeLists.txt
        working-directory: yubihsm-shell
        if: ${{ matrix.environment == 'centos:7' }}
        run: |
          # centos 7 comes with cmake version 2.8, but the project requires 3.5
          # we downgrade that requirement for the centos 7 build
          sed -i 's/cmake_minimum_required (VERSION 3.5)/cmake_minimum_required (VERSION 2.8)/' CMakeLists.txt
          # we also remove the following policies which are not supported in the older cmake version
          sed -i 's/cmake_policy(SET CMP0025 NEW)/#cmake_policy(SET CMP0025 NEW)/' CMakeLists.txt
          sed -i 's/cmake_policy(SET CMP0042 NEW)/#cmake_policy(SET CMP0042 NEW)/' CMakeLists.txt
          sed -i 's/cmake_policy(SET CMP0054 NEW)/#cmake_policy(SET CMP0054 NEW)/' CMakeLists.txt
          # append the following flags: -Wno-missing-braces -Wno-missing-field-initializers -Wno-implicit-function-declaration
          sed -i 's/-Wall -Wextra -Werror/-Wall -Wextra -Werror -Wno-missing-braces -Wno-missing-field-initializers/' cmake/SecurityFlags.cmake

      - name: do build
        working-directory: yubihsm-shell
        env:
          CC: ${{ matrix.cc }}
          VERBOSE: 1
        run: |
          mkdir build
          cd build
          if [ "$CC" = "gcc" ]; then
            cmake -DCMAKE_BUILD_TYPE=Release ..
          else
            cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_AR=/usr/bin/llvm-ar \
              -DCMAKE_RANLIB=/usr/bin/llvm-ranlib \
              -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
              ..
          fi
          cmake --build .

      - name: do static build
        working-directory: yubihsm-shell
        env:
          CC: ${{ matrix.cc }}
          VERBOSE: 1
          PLATFORM: ${{ env.PLATFORM }}
        run: |
          mkdir build-static
          cd build-static
          if [ "$CC" = "gcc" ]; then
            # lto breaks static builds on centos 7 so we disable it
            if [ $PLATFORM = "centos7" ]; then
              cmake -DENABLE_STATIC=ON -DCMAKE_BUILD_TYPE=Release -DDISABLE_LTO=ON ..
            else
              cmake -DENABLE_STATIC=ON -DCMAKE_BUILD_TYPE=Release ..
            fi
          else
            cmake -DENABLE_STATIC=ON -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_AR=/usr/bin/llvm-ar \
              -DCMAKE_RANLIB=/usr/bin/llvm-ranlib \
              -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
              ..
          fi
          cmake --build .

      - name: prepare name for upload-artifact action
        env:
          PLATFORM: ${{ env.PLATFORM }}
          CC: ${{ matrix.cc }}
        run: |
          echo "ARTIFACT_NAME=yubihsm-shell_${PLATFORM}_${CC}" >> $GITHUB_ENV

      - name: create compressed tar file
        if: ${{ matrix.upload_for_test == 'true' }}
        run: tar cfz yubihsm-shell.tar.gz yubihsm-shell

      - name: upload artifacts for the test job
        if: ${{ matrix.upload_for_test == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ARTIFACT_NAME }}"
          path: yubihsm-shell.tar.gz

  build_macos:
    name: build on macos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
          - os: macos-15-xlarge
          - os: macos-14-large
          - os: macos-14-xlarge

    steps:

      - name: install dependencies using brew
        run: brew install gengetopt help2man libedit opensc

      - name: clone the Yubico/yubihsm-shell repository
        uses: actions/checkout@v4
        with:
          path: yubihsm-shell

      - name: do build
        working-directory: yubihsm-shell
        env:
          VERBOSE: 1
        run: |

          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Test loading PKCS11 module
        working-directory: yubihsm-shell
        run: |
          echo connector=http://127.0.0.1:12345 > yubihsm_pkcs11.conf
          export YUBIHSM_PKCS11_CONF=$GITHUB_WORKSPACE/yubihsm-shell/yubihsm_pkcs11.conf
          pkcs11-tool --module build/pkcs11/yubihsm_pkcs11.dylib --show-info | grep Yubico

      - name: do static build
        working-directory: yubihsm-shell
        env:
          VERBOSE: 1
        run: |
          mkdir build-static
          cd build-static
          cmake -DENABLE_STATIC=ON -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: check binaries for hardening
        working-directory: yubihsm-shell
        run: |
          ./resources/release/macos/shell/check_hardening.sh "build/src/yubihsm-shell"

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: "ubuntu:24.04"
            cc: "clang"
          - environment: "fedora:44"
            cc: "gcc"

    name: run unit tests
    runs-on: ubuntu-latest
    container: ${{ matrix.environment }}
    needs: [build_debian_derivatives, build_centos_fedora]

    steps:

      - name: install dependencies from package management (debian based)
        env:
          DEBIAN_FRONTEND: noninteractive
        if: ${{ matrix.environment == 'ubuntu:24.04' }}
        run: |
          apt update
          apt install -q -y build-essential cmake python3 python3-pip python3-setuptools python3-venv curl libedit2 libpcsclite1 libengine-pkcs11-openssl opensc swig libssl3 zlib1g-dev

      - name: install dependencies from package management (rpm based)
        if: ${{ matrix.environment == 'fedora:44' }}
        run: |
          yum install -y gawk gcc gcc-c++ cmake python3-devel python3-pip python3-setuptools curl libedit gengetopt openssl libcurl pcsc-lite swig which zlib-devel crypto-policies-scripts

      - name: prepare name for download-artifact action
        env:
          DOCKER_IMAGE: ${{ matrix.environment }}
          CC: ${{ matrix.cc }}
        run: |
          ESCAPED_IMAGE=$(echo -n "$DOCKER_IMAGE" | sed -E 's/[^a-zA-Z0-9]//g')
          echo "ARTIFACT_NAME=yubihsm-shell_${ESCAPED_IMAGE}_${CC}" >> $GITHUB_ENV

      - name: download artifacts from the build job
        uses: actions/download-artifact@v4
        with:
          name: "${{ env.ARTIFACT_NAME }}"

      - name: decompress yubihsm-shell.tar.gz
        run: tar xfz yubihsm-shell.tar.gz

      - name: prepare ghostunnel
        env:
          TLSPWD: ${{ secrets.TLSKEY }}
          # GODEBUG required for ghostunnel to temporarily enable Common Name matching
          GODEBUG: x509ignoreCN=0
        run: |
          curl -o /tmp/ghostunnel -L https://github.com/ghostunnel/ghostunnel/releases/download/v1.6.0/ghostunnel-v1.6.0-linux-amd64
          chmod +x /tmp/ghostunnel
          openssl aes-256-cbc \
            -k "$TLSPWD" \
            -md sha256 \
            -in yubihsm-shell/.ci/client-combined.pem.enc \
            -out yubihsm-shell/.ci/client-combined.pem \
            -d
          /tmp/ghostunnel client \
            --listen localhost:12345 \
            --target hsm-connector01.sthlm.in.yubico.org:8443 \
            --keystore yubihsm-shell/.ci/client-combined.pem \
            --cacert yubihsm-shell/.ci/server-crt.pem > /dev/null 2>&1 &
          sleep 3
          DEFAULT_CONNECTOR_URL=$(curl -s http://localhost:12345/dispatcher/request)
          test -n "$DEFAULT_CONNECTOR_URL" || (echo "Unable to obtain a connector URL, aborting"; exit 1)
          echo "DEFAULT_CONNECTOR_URL=$DEFAULT_CONNECTOR_URL" >> $GITHUB_ENV

      - name: clone the YubicoLabs/pkcs11test repository
        uses: actions/checkout@v4
        with:
          repository: YubicoLabs/pkcs11test
          path: pkcs11test

      - name: build the pkcs11test binary
        working-directory: pkcs11test
        env:
          DOCKER_IMAGE: ${{ matrix.environment }}
        run: |
          if [ "$DOCKER_IMAGE" = "fedora:44" ]; then
            # Allows usage of SHA1
            #update-crypto-policies --show
            update-crypto-policies --set LEGACY
          fi
          make
          echo "PKCS11TEST_PATH=`pwd`" >> $GITHUB_ENV

      - name: reset the hsm
        working-directory: yubihsm-shell/build/src
        run: |
          ./yubihsm-shell --connector "$DEFAULT_CONNECTOR_URL" -a get-device-info
          ./yubihsm-shell --connector "$DEFAULT_CONNECTOR_URL" -p password -a reset
          sleep 3

      - name: run tests with ctest
        working-directory: yubihsm-shell/build
        env:
          DOCKER_IMAGE: ${{ matrix.environment }}
        run: |
          if [ $DOCKER_IMAGE = "debian:11" ]; then
            # we skip the engine tests (for now) since it ships with a broken curl version
            ctest --output-on-failure -E engine
          elif [ $DOCKER_IMAGE = "centos:7" ]; then
            # we skip the ecdh_derive tests (for now) since there is an issue with generating secp224r1 keys
            ctest --output-on-failure -E ecdh_derive\|aes\|ecdh_sp800
          else
            ctest --output-on-failure
          fi

      - name: clone the YubicoLabs/python-pkcs11tester repository
        uses: actions/checkout@v4
        with:
          repository: YubicoLabs/python-pkcs11tester
          path: python-pkcs11tester

      - name: run python-pkcs11tester
        if: ${{ matrix.environment == 'ubuntu:24.04' }}
        run: |
          export YUBIHSM_PKCS11_MODULE=`pwd`/yubihsm-shell/build/pkcs11/yubihsm_pkcs11.so
          cd python-pkcs11tester
          echo "connector=$DEFAULT_CONNECTOR_URL" > yubihsm_pkcs11.conf
          python3 -m venv venv
          . venv/bin/activate
          venv/bin/pip install setuptools pytest
          python3 -m pip install 'pykcs11' 'cryptography>=1.4.0'
          python3 -m unittest pkcs11tester.Pkcs11Tester

      - name: cleanup
        if: ${{ always() }}
        run: |
          if [ -n "$DEFAULT_CONNECTOR_URL" ]; then
            curl -s http://localhost:12345/dispatcher/release?connector=$DEFAULT_CONNECTOR_URL
          fi

  libressl_build:
    name: Build with LibreSSL
    runs-on: ubuntu-latest
    steps:
      - name: clone the Yubico/yubihsm-shell repository
        uses: actions/checkout@v4

      - name: install dependencies from package management
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -q -y build-essential       \
                            cmake pkg-config      \
                            gengetopt             \
                            help2man              \
                            libcurl4-openssl-dev  \
                            libedit-dev           \
                            libpcsclite-dev       \
                            libusb-1.0-0-dev      \
                            libssl-dev            \
                            file                  \
                            curl                  \
                            jq                    \
                            zlib1g-dev

      - name: Install LibreSSL from source
        run: |
          set -x
          cd $GITHUB_WORKSPACE
          wget -nv http://ftp.openbsd.org/pub/OpenBSD/LibreSSL/libressl-3.9.2.tar.gz
          tar -xzf libressl-3.9.2.tar.gz
          cd libressl-3.9.2
          mkdir build; cd build
          cmake ..
          make

      - name: Do build
        env:
          VERBOSE: 1
        run: |
          set -x
          mkdir build; cd build
          PKG_CONFIG_PATH=$GITHUB_WORKSPACE/libressl-3.9.2/build/pkgconfig cmake .. -DVERBOSE_CMAKE=ON
          make

          ./src/yubihsm-shell --help | grep "Usage: yubihsm-shell"

  openssl_1_1_build:
    name: Build with OpenSSL 1.1
    runs-on: ubuntu-latest
    steps:
      - name: clone the Yubico/yubihsm-shell repository
        uses: actions/checkout@v4

      - name: install dependencies from package management
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -q -y build-essential       \
                            cmake pkg-config      \
                            gengetopt             \
                            help2man              \
                            libcurl4-openssl-dev  \
                            libedit-dev           \
                            libpcsclite-dev       \
                            libusb-1.0-0-dev      \
                            libssl-dev            \
                            file                  \
                            curl                  \
                            jq                    \
                            zlib1g-dev

      - name: Install OpenSSL 1.1 from source
        run: |
          set -x
          cd $GITHUB_WORKSPACE
          wget -nv  https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_1_1w.tar.gz
          tar -xzf OpenSSL_1_1_1w.tar.gz
          cd openssl-OpenSSL_1_1_1w
          ./Configure linux-x86_64 shared --prefix=$GITHUB_WORKSPACE/openssl
          sudo make all install VERSION="1.1.1s"

      - name: Do build
        run: |
          set -x
          mkdir build; cd build
          cmake .. -DVERBOSE_CMAKE=ON -DOPENSSL_PKG_PATH=$GITHUB_WORKSPACE/openssl/lib/pkgconfig
          make

          ./src/yubihsm-shell --help | grep "Usage: yubihsm-shell"

  openssl_fips_build:
    name: Build with OpenSSL in FIPS mode
    runs-on: ubuntu-latest
    steps:
      - name: clone the Yubico/yubihsm-shell repository
        uses: actions/checkout@v4

      - name: install dependencies from package management
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -q -y build-essential       \
                            cmake pkg-config      \
                            gengetopt             \
                            help2man              \
                            libcurl4-openssl-dev  \
                            libedit-dev           \
                            libpcsclite-dev       \
                            libusb-1.0-0-dev      \
                            libssl-dev            \
                            file                  \
                            curl                  \
                            jq                    \
                            zlib1g-dev

      - name: Install OpenSSL with FIPS module from source
        run: |
          set -x
          cd $GITHUB_WORKSPACE
          wget -nv https://github.com/openssl/openssl/archive/refs/tags/openssl-3.0.9.tar.gz
          tar -xzf openssl-3.0.9.tar.gz
          cd openssl-openssl-3.0.9
          ./Configure enable-fips linux-x86_64 shared --prefix=$GITHUB_WORKSPACE/openssl --openssldir=$GITHUB_WORKSPACE/openssl/ssl --libdir=lib
          make -j"$(nproc)"
          sudo make install_sw install_ssldirs install_fips VERSION="3.0.9"
          sudo chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE/openssl

      - name: Configure OpenSSL to run in strict FIPS mode
        run: |
          set -x
          OPENSSL_ROOT=$GITHUB_WORKSPACE/openssl
          OPENSSL_BIN=$OPENSSL_ROOT/bin/openssl
          FIPS_CNF=$OPENSSL_ROOT/ssl/fipsmodule.cnf
          OPENSSL_CNF=$OPENSSL_ROOT/ssl/openssl.cnf
          export LD_LIBRARY_PATH=$OPENSSL_ROOT/lib:$LD_LIBRARY_PATH

          # record the self-test status the FIPS provider checks for at load time
          $OPENSSL_BIN fipsinstall -out $FIPS_CNF -module $OPENSSL_ROOT/lib/ossl-modules/fips.so

          # rebuild openssl.cnf so the fips provider (plus the non-cryptographic base
          # provider) is the only thing active - this is what enforces strict FIPS mode.
          # note: A '.include' file's sections are invisible to the
          # provider-activation logic so it silently falls back to the default provider with
          # no error. Splicing fipsmodule.cnf's own [fips_sect] (which already sets
          # activate = 1) directly into the file is what actually works.
          cat > $OPENSSL_CNF <<EOF
          openssl_conf = openssl_init

          [openssl_init]
          providers = provider_sect

          [provider_sect]
          fips = fips_sect
          base = base_sect

          [base_sect]
          activate = 1

          EOF
          cat $FIPS_CNF >> $OPENSSL_CNF

          # loud diagnostics - a missing/unreadable config file makes OpenSSL
          # silently fall back to the default provider instead of erroring out,
          # so assert on it explicitly rather than let that happen unnoticed
          # echo "---- $OPENSSL_ROOT/ssl listing ----"
          # ls -la $OPENSSL_ROOT/ssl
          # echo "---- $OPENSSL_CNF contents ----"
          # cat $OPENSSL_CNF
          # echo "---- $FIPS_CNF contents ----"
          # cat $FIPS_CNF
          # test -r "$OPENSSL_CNF" || (echo "FATAL: $OPENSSL_CNF is missing or unreadable"; exit 1)
          # test -r "$FIPS_CNF" || (echo "FATAL: $FIPS_CNF is missing or unreadable"; exit 1)

          OPENSSL_CONF=$OPENSSL_CNF $OPENSSL_BIN version -a
          OPENSSL_CONF=$OPENSSL_CNF $OPENSSL_BIN list -providers

          # config-triggered provider activation silently swallows load failures
          # and falls back to the default provider with no error - force an
          # explicit load instead, which surfaces the real underlying error
          echo "---- explicit -provider load (surfaces real errors) ----"
          OPENSSL_MODULES=$OPENSSL_ROOT/lib/ossl-modules \
            $OPENSSL_BIN list -providers -provider fips -provider base

      - name: verify strict FIPS mode is actually enforced
        env:
          OPENSSL_CONF: ${{ github.workspace }}/openssl/ssl/openssl.cnf
          OPENSSL_MODULES: ${{ github.workspace }}/openssl/lib/ossl-modules
          LD_LIBRARY_PATH: ${{ github.workspace }}/openssl/lib
        run: |
          set -x
          OPENSSL_BIN=$GITHUB_WORKSPACE/openssl/bin/openssl

          # loud diagnostics - confirm what this step actually sees before
          # asserting anything, since a missing/unreadable OPENSSL_CONF file
          # makes OpenSSL silently fall back to the default provider with no error
          # echo "OPENSSL_CONF=$OPENSSL_CONF"
          # echo "OPENSSL_MODULES=$OPENSSL_MODULES"
          # echo "---- $OPENSSL_CONF listing ----"
          # ls -la "$OPENSSL_CONF" || echo "$OPENSSL_CONF does not exist"
          # echo "---- $OPENSSL_CONF contents ----"
          # cat "$OPENSSL_CONF" || echo "cannot read $OPENSSL_CONF"
          # test -r "$OPENSSL_CONF" || (echo "FATAL: $OPENSSL_CONF is missing or unreadable from this step"; exit 1)

          $OPENSSL_BIN list -providers

          # only the fips and base providers should be active - the default
          # provider must not be loaded, otherwise FIPS mode isn't actually strict
          $OPENSSL_BIN list -providers | grep -q "name: OpenSSL FIPS Provider"
          if $OPENSSL_BIN list -providers | grep -q "name: OpenSSL Default Provider"; then
            echo "the default provider is loaded - strict FIPS mode is not being enforced"
            exit 1
          fi

          # The FIPS provider enforces a 128-bit (16-byte) minimum PBKDF2 salt, so
          # deriving with the 6-byte salt "Yubico" must fail under strict FIPS
          if $OPENSSL_BIN kdf -keylen 16 -kdfopt digest:SHA2-256 -kdfopt pass:password \
              -kdfopt salt:Yubico -kdfopt iter:10000 PBKDF2 2>err.log; then
            echo "PBKDF2 with a 6-byte salt succeeded - strict FIPS mode is not being enforced"
            cat err.log
            exit 1
          fi
          cat err.log
          grep -qi "invalid salt length" err.log

      - name: Do build
        env:
          OPENSSL_CONF: ${{ github.workspace }}/openssl/ssl/openssl.cnf
          OPENSSL_MODULES: ${{ github.workspace }}/openssl/lib/ossl-modules
        run: |
          set -x
          mkdir build; cd build
          PKG_CONFIG_PATH=$GITHUB_WORKSPACE/openssl/lib/pkgconfig cmake .. -DVERBOSE_CMAKE=ON
          make

          ./src/yubihsm-shell --help | grep "Usage: yubihsm-shell"

      - name: prepare ghostunnel
        env:
          TLSPWD: ${{ secrets.TLSKEY }}
          # GODEBUG required for ghostunnel to temporarily enable Common Name matching
          GODEBUG: x509ignoreCN=0
        run: |
          curl -o /tmp/ghostunnel -L https://github.com/ghostunnel/ghostunnel/releases/download/v1.6.0/ghostunnel-v1.6.0-linux-amd64
          chmod +x /tmp/ghostunnel
          openssl aes-256-cbc \
            -k "$TLSPWD" \
            -md sha256 \
            -in .ci/client-combined.pem.enc \
            -out .ci/client-combined.pem \
            -d
          /tmp/ghostunnel client \
            --listen localhost:12345 \
            --target hsm-connector01.sthlm.in.yubico.org:8443 \
            --keystore .ci/client-combined.pem \
            --cacert .ci/server-crt.pem > /dev/null 2>&1 &
          sleep 3
          DEFAULT_CONNECTOR_URL=$(curl -s http://localhost:12345/dispatcher/request)
          test -n "$DEFAULT_CONNECTOR_URL" || (echo "Unable to obtain a connector URL, aborting"; exit 1)
          echo "DEFAULT_CONNECTOR_URL=$DEFAULT_CONNECTOR_URL" >> $GITHUB_ENV

      - name: Test authentication
        working-directory: build/src
        run: |
          ./yubihsm-shell --connector "$DEFAULT_CONNECTOR_URL" -a get-device-info
          ./yubihsm-shell --connector "$DEFAULT_CONNECTOR_URL" -p password -a list-objects
